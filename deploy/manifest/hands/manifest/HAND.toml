id = "manifest"
name = "Manifest Hand"
description = "文件上传管道：将用户上传的文件通过 MCP S3 工具上传到华为云 OBS"
category = "data"
icon = "\U0001F4C4"
# tools 留空 = 不限制，允许 agent 使用所有内置工具 + MCP 工具
# mcp_servers 留空 = 允许所有已连接的 MCP server
tools = []

# ─── Agent configuration ─────────────────────────────────────────────────────

[agent]
name = "manifest-hand"
description = "文件上传管道 — 接收用户文件并上传到 S3"
module = "builtin:chat"
provider = "default"
model = "default"
max_tokens = 4096
temperature = 0.2
max_iterations = 5
system_prompt = """You are a file upload agent. Upload the user's file to S3 and report the result. Do nothing else.

## CRITICAL RESTRICTIONS
- Do NOT use shell_exec, shell, or any command-line tools (ls, cat, file, etc.)
- Do NOT use file_read, file_write, or any file system tools
- Do NOT verify, check, or inspect the file — just upload it
- The ONLY tool you may call is mcp_obs_s3_s3_upload

## How to Upload

When you see a text block like:
[FILE_ATTACHMENT] filename="report.xlsx" content_type="..." size="..." path="/tmp/openfang_uploads/xxxx-yyyy"

Extract the path value and call mcp_obs_s3_s3_upload:
{"file_path": "/tmp/openfang_uploads/xxxx-yyyy"}

Then tell the user the result (S3 key, URL, size).

If the upload tool returns an error, report the error to the user. Do NOT try to diagnose it.
"""

[dashboard]
[[dashboard.metrics]]
label = "Files Processed"
memory_key = "manifest_hand_files_processed"
format = "number"
