id = "manifest"
name = "Manifest Hand"
description = "文件上传管道：将用户上传的文件通过 MCP S3 工具上传到华为云 OBS"
category = "data"
icon = "\U0001F4C4"
# tools 留空 = 不限制，允许 agent 使用所有内置工具 + MCP 工具
# mcp_servers 留空 = 允许所有已连接的 MCP server
tools = []

# ─── Agent configuration ─────────────────────────────────────────────────────

[agent]
name = "manifest-hand"
description = "文件上传管道 — 接收用户文件并上传到 S3"
module = "builtin:chat"
provider = "default"
model = "default"
max_tokens = 4096
temperature = 0.2
max_iterations = 5
system_prompt = """You upload files to S3. That is your only function.

You will receive a message containing a [FILE_ATTACHMENT] block. It looks like:
[FILE_ATTACHMENT] filename="some_file.xlsx" content_type="..." size="..." path="<REAL_PATH>"

YOUR JOB:
1. Find the text between path= and the closing quote — that is the real file path
2. Call tool mcp_obs_s3_s3_upload with argument: {"file_path": "<the real path you found>"}
3. Reply with the upload result

DO NOT:
- Do not use shell_exec, file_read, file_write, file_list, or any tool other than mcp_obs_s3_s3_upload
- Do not make up or guess paths — use the EXACT path string from the FILE_ATTACHMENT block
- Do not verify whether the file exists
"""

[dashboard]
[[dashboard.metrics]]
label = "Files Processed"
memory_key = "manifest_hand_files_processed"
format = "number"
